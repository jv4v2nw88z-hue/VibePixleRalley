<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rally Pixel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230a0d11'/%3E%3Crect x='2' y='1' width='4' height='6' fill='%23d8452f'/%3E%3Crect x='2' y='2' width='4' height='1' fill='%233d5d7a'/%3E%3Crect x='2' y='5' width='4' height='1' fill='%233d5d7a'/%3E%3Crect x='1' y='2' width='1' height='1' fill='%23171a1c'/%3E%3Crect x='6' y='2' width='1' height='1' fill='%23171a1c'/%3E%3Crect x='1' y='5' width='1' height='1' fill='%23171a1c'/%3E%3Crect x='6' y='5' width='1' height='1' fill='%23171a1c'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0d11">
<meta name="description" content="Rally Pixel - a pixel-art rally time-trial game. Race gravel, tarmac and snow stages from inside the cockpit, earn credits, upgrade your car in the garage.">
</head>
<body>
<div id="app">
  <!-- the world, the pixel HUD and the countdown all live on this one canvas -->
  <canvas id="game"></canvas>

  <!-- the cockpit. One canvas: instruments, tell-tales and every touch
       control, so the dash art and the hit map can never drift apart. -->
  <canvas id="dash-cv" class="hidden"></canvas>

  <!-- ============ main menu ============ -->
  <div class="screen" id="screen-menu">
    <div id="menu-logo">
      <canvas id="menu-car" width="160" height="160" style="width:clamp(72px,20vh,150px);height:clamp(72px,20vh,150px)"></canvas>
      <h1 class="title">RALLY PIXEL</h1>
      <p class="subtitle">GRAVEL &middot; TARMAC &middot; SNOW</p>
    </div>
    <div id="menu-buttons">
      <button class="btn primary" data-go="stages">PLAY</button>
      <button class="btn" data-go="garage">GARAGE</button>
      <button class="btn" data-go="settings">SETTINGS</button>
    </div>
    <div class="row" style="margin-top:6px;font-size:11px;letter-spacing:1px">
      <span class="muted" style="color:var(--muted)">CREDITS</span> <span class="money" id="menu-money">0</span>
    </div>
    <div id="menu-foot">TIME-TRIAL RALLY &middot; TAP PLAY TO START A STAGE</div>
  </div>

  <!-- ============ stage select ============ -->
  <div class="screen hidden" id="screen-stages">
    <div class="row spread">
      <div><h1 class="title" style="font-size:clamp(15px,3.2vh,24px)">SELECT STAGE</h1></div>
      <div class="row"><span class="money" id="stages-money">0</span><button class="btn small" data-go="menu">BACK</button></div>
    </div>
    <div class="grow scroll"><div id="stage-list"></div></div>
  </div>

  <!-- ============ garage ============ -->
  <div class="screen scene hidden" id="screen-garage">
    <div class="row spread" style="margin-bottom:6px">
      <h1 class="title" style="font-size:clamp(15px,3.2vh,24px)">GARAGE</h1>
      <div class="row">
        <span class="money" id="garage-money">0</span>
        <button class="btn small" data-go="lot">PARKING LOT</button>
        <button class="btn small" data-go="menu">BACK</button>
      </div>
    </div>
    <!-- equip-to-preview confirm bar: shown only while something unpaid is on
         the car. It sits above the bay so the stats card below stays put. -->
    <div id="preview-bar" class="hidden">
      <div class="pv-txt">
        <div class="pv-name" id="pv-name">ITEM</div>
        <div class="pv-note" id="pv-note"></div>
      </div>
      <div class="pv-price">
        <div class="pv-cost"><span>COST</span><b id="pv-cost">CR 0</b></div>
        <div class="pv-after" id="pv-after"></div>
      </div>
      <button class="btn small primary" id="pv-buy">PURCHASE</button>
      <button class="btn small" id="pv-cancel">CANCEL</button>
    </div>
    <div id="garage-body">
      <div id="garage-stage">
        <div id="car-name">CAR</div>
        <div id="car-plate"></div>
        <div id="car-stats"></div>
      </div>
      <div id="garage-right">
        <div id="tabs">
          <button class="btn small tab active" data-tab="upgrades">UPGRADES</button>
          <button class="btn small tab" data-tab="tires">TIRES</button>
          <button class="btn small tab" data-tab="paint">PAINT</button>
          <button class="btn small tab" data-tab="cars">CARS</button>
        </div>
        <div id="tab-body" class="card scroll grow"></div>
      </div>
    </div>
  </div>

  <!-- ============ parking lot ============ -->
  <div class="screen scene hidden" id="screen-lot">
    <div class="row spread" style="margin-bottom:4px">
      <h1 class="title" style="font-size:clamp(15px,3.2vh,24px)">PARKING LOT</h1>
      <div class="row">
        <span class="money" id="lot-money">0</span>
        <button class="btn small" data-go="garage">GARAGE</button>
      </div>
    </div>
    <div id="lot-hint">TAP A CAR TO TAKE IT OUT</div>
    <div class="grow"><div id="lot-list"></div></div>
  </div>

  <!-- ============ settings ============ -->
  <div class="screen hidden" id="screen-settings">
    <div class="row spread" style="margin-bottom:6px">
      <h1 class="title" style="font-size:clamp(15px,3.2vh,24px)">SETTINGS</h1>
      <button class="btn small" data-go="menu">BACK</button>
    </div>
    <div class="card grow scroll" style="padding:4px 10px" id="settings-body"></div>
  </div>

  <!-- ============ results ============ -->
  <div class="screen hidden" id="screen-results">
    <h1 class="title" id="res-title">STAGE COMPLETE</h1>
    <div id="res-sub">PINE HOLLOW</div>
    <div id="res-body">
      <div class="card res-card" id="res-times"></div>
      <div class="card res-card" id="res-rows"></div>
    </div>
    <div class="row" id="res-buttons"></div>
  </div>

  <!-- ============ pause ============ -->
  <div id="pause-overlay" class="hidden">
    <h1 class="title">PAUSED</h1>
    <div class="row">
      <button class="btn primary" id="pause-resume">RESUME</button>
      <button class="btn" id="pause-restart">RESTART</button>
      <button class="btn" id="pause-quit">QUIT</button>
    </div>
  </div>

  <!-- ============ orientation ============ -->
  <div id="rotate">
    <canvas id="rotate-cv" width="120" height="120"></canvas>
    <div class="title" style="font-size:clamp(15px,4.4vw,22px)">ROTATE DEVICE</div>
    <div class="subtitle">RALLY PIXEL PLAYS IN LANDSCAPE</div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
